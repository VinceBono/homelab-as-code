---
- name: Baseline every lab machine
  hosts: all
  become: true
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - unattended-upgrades
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Turn on automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    - name: Allow key-based sign-in only, and never as root
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Allow SSH through the firewall
      community.general.ufw:
        rule: limit
        name: OpenSSH

    - name: Block all other incoming traffic
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

- name: Container hosts
  hosts: docker
  become: true
  tasks:
    - name: Install Docker from the distribution
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Let the administrator account use Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
